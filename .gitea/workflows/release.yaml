name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch ${GITHUB_REF_NAME} http://git-aeoru.local:3000/entity/ccguilt.git .

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Rename binary
        run: cp target/release/ccguilt ccguilt-linux-amd64

      - name: Create release and upload
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API=http://git-aeoru.local:3000/api/v1/repos/entity/ccguilt
          TAG=${GITHUB_REF_NAME}
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Automated release for ${TAG}\"}" \
            "${API}/releases" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @ccguilt-linux-amd64 \
            "${API}/releases/${RELEASE_ID}/assets?name=ccguilt-linux-amd64"
          echo "Release ${TAG} created with binary"
