name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch ${GITHUB_REF_NAME} http://git-aeoru.local/entity/ccguilt.git .

      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          command -v cc >/dev/null || (apt-get update && apt-get install -y build-essential)
          # Installs the version and components pinned in rust-toolchain.toml
          rustup toolchain install

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Rename binary
        run: cp target/release/ccguilt ccguilt-linux-x86_64

      - name: Create release and upload
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API=http://git-aeoru.local/api/v1/repos/entity/ccguilt
          TAG=${GITHUB_REF_NAME}
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Automated release for ${TAG}\"}" \
            "${API}/releases" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @ccguilt-linux-x86_64 \
            "${API}/releases/${RELEASE_ID}/assets?name=ccguilt-linux-x86_64"
          echo "Release ${TAG} created with binary"
