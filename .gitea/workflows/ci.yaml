name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 http://git-aeoru.local/entity/ccguilt.git .
          git fetch origin ${{ github.sha }} && git checkout ${{ github.sha }} || true

      - name: Install Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          command -v cc >/dev/null || (apt-get update && apt-get install -y build-essential)
          # Installs the version and components pinned in rust-toolchain.toml
          rustup toolchain install

      - name: Rust version
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version

      - name: Check formatting
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --check

      - name: Clippy
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy -- -D warnings

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test
